server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/shopify_db}
    username: ${SPRING_DATASOURCE_USERNAME:shopify_user}
    password: ${SPRING_DATASOURCE_PASSWORD:shopify_pass}
  jpa:
    hibernate:
      ddl-auto: validate      # las tablas las crea db/init; Hibernate solo verifica que coincidan
    open-in-view: false
    # SQL en consola: apagado por defecto (llena el log). Para depurar: JPA_SHOW_SQL=true
    show-sql: ${JPA_SHOW_SQL:false}
  mvc:
    # Spring (con devtools) registra cada error con los valores recibidos, incluso contraseñas.
    # Se apaga: GlobalExceptionHandler deja su propia línea, sin datos sensibles.
    log-resolved-exception: false

logging:
  file:
    name: logs/vendely.log          # además de la consola, los logs quedan en este archivo
  logback:
    rollingpolicy:
      max-file-size: 10MB           # al llegar a 10 MB empieza un archivo nuevo
      max-history: 7                # se guardan los últimos 7 días
  level:
    root: INFO
    curso.fullstack.shopify: INFO   # DEBUG para ver más detalle del código de Vendely

app:
  jwt:
    # En producción SIEMPRE viene de la variable JWT_SECRET (mínimo 32 caracteres)
    secret: ${JWT_SECRET:cambia-esto-por-una-clave-larga-y-aleatoria-de-al-menos-32-bytes}
    expiration: ${JWT_EXPIRATION:86400000}   # 24 horas en milisegundos
  cors:
    # Orígenes (frontend) que pueden llamar a la API desde el navegador, separados por coma
    origenes: ${CORS_ORIGENES:http://localhost:5173,http://localhost:5174}
  mercadopago:
    # Access Token de PRUEBA (TEST-...). Nunca se escribe aquí: viene de la variable de entorno.
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  # Dirección del frontend: a ella vuelve el cliente después de pagar en Mercado Pago
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

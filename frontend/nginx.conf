# nginx para la imagen de produccion del frontend (issue #12).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Comprime JS, CSS, SVG y JSON (el HTML ya se comprime por defecto).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Los archivos de assets/ llevan un hash en el nombre: se pueden guardar
    # en cache un año sin riesgo de servir una version vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: cualquier ruta que no sea un archivo devuelve index.html.
    # Es el equivalente del "rewrites" de vercel.json; sin esto, recargar
    # /panel/productos o /tienda/mitienda da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html no se guarda en cache para que un despliegue nuevo se vea al
    # recargar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Ya no se monta ./db/init: el esquema lo aplica Flyway cuando arranca el
      # backend. La base arranca vacía y así también las bases que ya existen
      # reciben los cambios (el montaje de Postgres solo corre la primera vez).

  backend:
    build:
      context: ./backend/shopify
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # Carpetas de migraciones que aplica Flyway al arrancar. Por defecto van las
      # dos; en el servidor se deja solo classpath:db/migration para no crear los
      # usuarios de prueba (se define en el panel de Render o en el .env).
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/migration-local}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      CORS_ORIGENES: ${CORS_ORIGENES}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      # Firma de los avisos de pago. Sin estas dos, los webhook responden 503.
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      # Fotos de los productos. Sin esto solo se pueden pegar enlaces.
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      # Correos: Brevo si estan su clave y su remitente; si no, Resend. Sin ninguno se registran
      # como simulados y no se envia nada.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_REMITENTE_CORREO: ${BREVO_REMITENTE_CORREO:-}
      BREVO_REMITENTE_NOMBRE: ${BREVO_REMITENTE_NOMBRE:-Vendely}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_REMITENTE: ${RESEND_REMITENTE:-Vendely <onboarding@resend.dev>}
      # Codigo de 6 digitos al correo antes de crear la cuenta del dueno y del cliente (false: sin codigo).
      VERIFICAR_CORREO: ${VERIFICAR_CORREO:-true}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      - db

  frontend:
    # Imagen de produccion: compila con Vite y la sirve nginx en el puerto 80.
    # VITE_API_BASE_URL va como argumento del build porque Vite la incrusta al
    # compilar; si cambia, hay que reconstruir: docker compose up --build.
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  db_data: